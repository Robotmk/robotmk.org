hero:
  eyebrow: "The Comparison"
  title: "Good Reasons to Choose Robotmk"
  subtitle: "A single control – for a fair and transparent pricing model."

pricing:
  heading: "The Cost Trap"
  intro: "Most major platforms charge for synthetic monitoring as <b>a product of several mutually reinforcing variables</b>.<br><br>The easy and affordable start-up costs are later offset by a bill that grows not linearly, but exponentially 📈. <br><br><b>Robotmk</b> has just one control: the test case. <br>One more test, one more predictable cost. <br>Because synthetic monitoring must be able to scale with your requirements."
  formula_competitor: "Number of tests <br>× Interval <br>× Requests/test <br>× Rate"
  formula_checkmk: "Number of tests <br>× Rate"
  formula_competitor_label: "Competitor"
  formula_checkmk_label: "Robotmk"
  table:
    caption: "Sample calculation: Monthly costs for 15 test cases with 8 requests per test, run at 15-minute intervals. (Illustrative example; not a current quote from the manufacturers.)"
    rows:
      - label: "Billed per"
        dynatrace: "Actions (requests)"
        datadog: "Test runs"
        grafana: "Test runs"
        checkmk: "🟢<br>Tests discovered in Checkmk (=services)"
      - label: "Rate"
        dynatrace: "$4.50 / 1k actions"
        datadog: "$12 / 1k runs"
        grafana: "$44 / 1k runs"
        checkmk: "🟢<br>flat rate"
      - label: "Cost / month<br>(15-minute interval)"
        dynatrace: "€1,388"
        datadog: "€463"
        grafana: "€1,696"
        checkmk: "🟢<br>€135"
      - label: "Costs / month<br>(5-minute interval)"
        dynatrace: "€4,162"
        datadog: "€1,388"
        grafana: "€5,088"
        checkmk: "🟢<br>€135"
  source_note: ""

fairness:
  label: "Note"
  heading: "For a fair comparison:"
  columns:
    - side: "cloud"
      label: "Cloud providers"
      text: "The infrastructure is included in each case – you don’t need to provision anything. <br>That’s why you pay <b>per execution</b>, and this is precisely what results in the <b>exponential price trend</b>."
    - side: "robotmk"
      label: "Robotmk"
      text: "You provide the machines on which testing takes place. This involves a little more <b>personal responsibility for the setup</b>."
  conclusion: "Using Robotmk for synthetic monitoring means: your machine, your data, your bill – everything is in your hands."

pillars:
  heading: "Further reasons beyond the price"
  more_label: "Find out more"
  items:
    - icon: "open-source"
      title: "Open Source"
      text: "Robot Framework is open source – and has been for over 20 years."
      more: "Because the entire source code is open, your security team can check exactly what is running in your environment. No per-seat licensing restrictions on the tooling itself."
    - icon: "no-lockin"
      title: "No vendor lock-in"
      text: "Portable test definitions, free from a vendor’s proprietary format."
      more: "Robot Framework is a testing and automation tool used all over the world. If you switch platforms, your tests move with you unchanged: no proprietary recorder format to rewrite, no lossy export. Your investment in testing remains yours."
    - icon: "integration"
      title: "Deepest integration with Checkmk"
      text: "Robotmk is a native Checkmk extension."
      more: "No separate portal, no fragile API middle layers that need to be kept in sync. You benefit from the same user experience you’re used to with Checkmk."
    - icon: "one-framework"
      title: "One framework for every technology"
      text: "Web, desktop, API, SAP, Citrix, mobile — Robot Framework is the Swiss Army knife of test automation."
      more: "Robot Framework offers a library for every technology and a uniform ‘keyword’ syntax that makes test creation easy."
    - icon: "bridge"
      title: "The Robotmk Bridge"
      text: "Have you already invested in JUnit, Tosca, Gatling or ZAP? The Robotmk Bridge brings these results into Checkmk too — without having to rewrite anything."
      more: "The Robotmk Bridge imports results from tools you’re already using and displays them as Checkmk services alongside your Robot Framework tests."
    - icon: "community"
      title: "The lingua franca of test automation"
      text: "Not a niche bet – Robot Framework has over 40,000 users worldwide."
      more: "Robot Framework is the de facto standard for test automation. You’re building on a vibrant ecosystem, not on a single vendor’s roadmap."
    - icon: "vscode"
      title: "RobotCode: First-class VS Code support"
      text: " With the RobotCode extension, you can develop tests right where your team already works — complete with auto-completion, a debugger and a test explorer."
      more: "RobotCode turns VS Code into a fully-fledged IDE for Robot Framework, featuring code completion and a debugger with breakpoints and variable inspection – plus many more features."
    - icon: "no-risk"
      title: "No staff risk"
      text: "Robot Framework is readable, maintainable and widely used. You’ll have no trouble setting it up or handing it over."
      more: "The clear, keyword-driven syntax is extremely readable and maintainable. Set-up is easier, onboarding is quicker, and handover doesn’t turn into a refactoring exercise."

explorer:
  interval_label: "Execution interval"
  interval_tooltip: "The shorter the interval, the better the detection rate: issues on the user’s end can then be resolved all the more quickly."
  interval_steps:
    - "30 mins"
    - "15 mins"
    - "5 mins"
    - "1 min"
  test_case_slider_label: "Number of test cases"
  test_case_tooltip: "Test = a single, isolated and automatable user journey — the more targeted the monitoring, the more precise the alert in the event of an error."
  y_axis_label: "Cost per month"
  readout_hint: ""
  # disclaimer: "Illustrative model, not a current offer from the vendors — uses the same example rate as above (8 requests/test, fixed, Dynatrace only). Grafana and Datadog charge based on complete test runs, not on requests. Checkmk’s curve is interpolated between two real reference points from its own price list (15 test cases = €135/month; 1,000 test cases = €2,333/month) — the exact discount formula in between has not been published, so this is a plausible estimate, not an official quote. The scale is deliberately fixed: bars that exceed it are marked as ‘off-scale’ rather than silently rescaling the axis."
  disclaimer: ""
  requests_per_test: 8
  usd_to_eur: 0.88
  dynatrace_rate_usd_per_1k_actions: 4.50
  datadog_rate_usd_per_1k_runs: 12
  grafana_rate_usd_per_1k_runs: 44
  checkmk_min_price_eur: 135
  checkmk_max_price_eur: 2333
  test_case_min: 15
  test_case_max: 1000
  y_axis_max: 4000
  # 15 × 4 × 24 × (365/12) = 43,800 runs per month
  # × 8 = 350,400 requests per month  
  vendors:
    - key: "dynatrace"
      name: "Dynatrace"
      tooltip: "Billed per network request: interval × test cases × steps per test — all multiplied together."
    - key: "datadog"
      name: "Datadog"
      tooltip: "Billed per complete test run: interval × test cases. Steps within a test are free of charge."
    - key: "grafana"
      name: "Grafana"
      tooltip: "Same model as Datadog — billed per complete test run, at a higher rate."
    - key: "checkmk"
      name: "<b>Robotmk</b>"
      tooltip: "Billed solely on the number of test cases. Interval and steps are always free of charge."