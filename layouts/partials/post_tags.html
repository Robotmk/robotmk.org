{{- $page := .page -}}
{{- $class := .class | default "" -}}
{{- with $page.Params.tags }}
<div class="post__tags{{ with $class }} {{ . }}{{ end }}">
  {{ range . }}{{ $tag := . }}{{ $term := $page.Site.GetPage (printf "/tags/%s" (. | urlize)) }}
  <a href="{{ with $term }}{{ .RelPermalink }}{{ else }}{{ (printf "/tags/%s/" ($tag | urlize)) | relLangURL }}{{ end }}" class="badge post__tag">{{ with $term }}{{ .Title }}{{ else }}{{ $tag | humanize }}{{ end }}</a>{{ end }}
</div>
{{- end -}}
