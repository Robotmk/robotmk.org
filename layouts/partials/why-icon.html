{{- /*
  Custom monoline icon set for the "Why Robotmk" pillar cards.
  24x24 viewBox, stroke=currentColor, no fills — colored via CSS on the
  parent, not baked into the SVG, so hover/theme changes just work.
  Usage: {{ partial "why-icon.html" "open-source" }}
*/ -}}
{{- $name := . -}}
<svg class="why-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {{- if eq $name "open-source" }}
  <rect x="5" y="11" width="14" height="9" rx="1.5"/>
  <path d="M8 11V7.5A4 4 0 0 1 15.5 5"/>
  <circle cx="12" cy="15.5" r="1.4"/>

  {{- else if eq $name "no-lockin" }}
  <circle cx="8" cy="12" r="4.2"/>
  <circle cx="16.4" cy="12" r="4.2"/>

  {{- else if eq $name "integration" }}
  <rect x="3" y="3" width="10.5" height="10.5" rx="1"/>
  <rect x="10.5" y="10.5" width="10.5" height="10.5" rx="1"/>

  {{- else if eq $name "one-framework" }}
  <circle cx="12" cy="12" r="2.6"/>
  <circle cx="12" cy="4" r="1.8"/>
  <circle cx="20" cy="12" r="1.8"/>
  <circle cx="12" cy="20" r="1.8"/>
  <circle cx="4" cy="12" r="1.8"/>
  <path d="M12 6.3V9.6M17.7 12h-3M12 17.7v-3.1M6.3 12h3"/>

  {{- else if eq $name "bridge" }}
  <path d="M3 18a9 9 0 0 1 18 0"/>
  <path d="M3 18h18"/>

  {{- else if eq $name "community" }}
  <rect x="2.5" y="4.5" width="12" height="8.5" rx="2"/>
  <path d="M6 13v3l4-3"/>
  <rect x="9.5" y="10" width="12" height="8.5" rx="2"/>
  <path d="M21.5 18.5v3l-4-3"/>

  {{- else if eq $name "no-risk" }}
  <path d="M12 3.2 19 6v5.5c0 5-3.2 7.9-7 9-3.8-1.1-7-4-7-9V6l7-2.8z"/>
  <path d="M8.7 12.2l2.2 2.2 4.4-4.4"/>
  {{- end }}
</svg>
